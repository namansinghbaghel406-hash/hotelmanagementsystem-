server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Single page app: unknown paths fall back to index.html so React Router can handle them
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}
